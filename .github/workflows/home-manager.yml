name: Build

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/home-manager.yml
      - flake.*
      - home.nix
      - home/**
      - packages/**
      - templates/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/home-manager.yml
      - flake.*
      - home.nix
      - home/**
      - packages/**
      - templates/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: false
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: sestrella
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check flake
        run: nix flake check --no-pure-eval

  build:
    needs: [check]
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: sestrella
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build home configuration
        run: nix run . -- build --flake .
