name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - LICENSE
      - README.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devenv-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix profile add nixpkgs#devenv
      - run: devenv test
        timeout-minutes: 5

  devenv-build:
    runs-on: macos-latest
    needs: [devenv-test]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: sestrella
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix profile add nixpkgs#devenv
      - run: echo '{ cachix.push = "sestrella"; }' > devenv.local.nix
      - run: devenv build
        timeout-minutes: 5
    
  hm-build:
    runs-on: macos-latest
    needs: [devenv-test]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: sestrella
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix run home-manager/master -- build --flake .
        timeout-minutes: 10
